name: Extract Mammoth Events

on:
  schedule:
    - cron: '0 12 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run Mammoth Extraction
        run: python extract_mammoth_events.py

      - name: Commit and Push ICS File
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add mammoth_events.ics
          if git diff --staged --quiet; then
            echo "No calendar updates detected."
          else
            git commit -m "chore: auto-update mammoth_events.ics [skip ci]"
            git push
          fi
